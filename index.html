<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPGSave加解密转换器 V1.1</title>
<script src="./vendor/lz-string-1.5.0.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.container { width: 100%; max-width: 700px; }
h1 { text-align: center; margin-bottom: 30px; color: #e94560; font-size: 1.6em; }
.card { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #0f3460; }
.card h2 { font-size: 1.15em; margin-bottom: 16px; color: #53d8fb; display: flex; align-items: center; gap: 8px; }
.card h2 .icon { font-size: 1.4em; }
.upload-area { border: 2px dashed #0f3460; border-radius: 10px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all .2s; background: #1a1a2e; }
.upload-area:hover, .upload-area.drag-over { border-color: #53d8fb; background: #1a2744; }
.upload-area p { color: #888; margin-top: 8px; font-size: .85em; }
.upload-area .main-text { color: #ccc; font-size: 1em; }
input[type="file"] { display: none; }
.file-info { margin-top: 12px; padding: 10px 14px; background: #1a1a2e; border-radius: 8px; font-size: .85em; color: #53d8fb; display: none; }
.file-info.show { display: block; }
.btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1em; cursor: pointer; font-weight: bold; transition: all .2s; margin-top: 14px; }
.btn-decrypt { background: #e94560; color: #fff; }
.btn-decrypt:hover { background: #c23152; }
.btn-encrypt { background: #53d8fb; color: #1a1a2e; }
.btn-encrypt:hover { background: #3dc0e0; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.msg { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: .85em; display: none; }
.msg.success { display: block; background: #0a3d2e; color: #5eeab0; border: 1px solid #1a6b4a; }
.msg.error { display: block; background: #3d0a0a; color: #ff6b6b; border: 1px solid #6b1a1a; }
.note { margin-top: 16px; font-size: .75em; color: #666; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
    <h1>RPGSave加解密转换器 V1.1</h1>

    <!-- Decrypt: rpgsave → txt -->
    <div class="card">
        <h2><span class="icon">🔓</span>解密：rpgsave → 可读文本</h2>
        <div class="upload-area" id="decryptDropZone">
            <p class="main-text">拖拽 .rpgsave 文件到此处</p>
            <p>或点击选择文件</p>
            <input type="file" id="decryptInput" accept=".rpgsave">
        </div>
        <div class="file-info" id="decryptFileInfo"></div>
        <button class="btn btn-decrypt" id="decryptBtn" disabled>解密并下载 txt</button>
        <div class="msg" id="decryptMsg"></div>
    </div>

    <!-- Encrypt: txt → rpgsave -->
    <div class="card">
        <h2><span class="icon">🔒</span>加密：txt → rpgsave</h2>
        <div class="upload-area" id="encryptDropZone">
            <p class="main-text">拖拽 解密后的 .txt 文件到此处</p>
            <p>或点击选择文件</p>
            <input type="file" id="encryptInput" accept=".txt">
        </div>
        <div class="file-info" id="encryptFileInfo"></div>
        <button class="btn btn-encrypt" id="encryptBtn" disabled>加密并下载 rpgsave</button>
        <div class="msg" id="encryptMsg"></div>
    </div>

    <p class="note">
        支持的格式：JSON元数据 + ###SAVEDATA### + LZ-String Base64 压缩数据<br>
        所有处理均在浏览器本地完成，不会上传到任何服务器
    </p>
</div>

<script>
(function () {
    'use strict';

    const saveMarker = '###SAVEDATA###';
    const metaHeading = '========== 存档元数据 ==========';
    const gameHeading = '========== 解密后的游戏数据 ==========';
    const base64Pattern = /^([A-Za-z0-9+/]+)(={0,3})$/;

    function trimJson(text) {
        return text.replace(/^[\t\r\n ]+|[\t\r\n ]+$/g, '');
    }

    function validateJson(text, label) {
        try {
            JSON.parse(text);
        } catch (error) {
            if (error instanceof SyntaxError) throw new Error(label + ' JSON 无效，请检查对应数据段。');
            throw error;
        }
    }

    // Format JSON tokens without turning numbers or duplicate keys into JS values.
    function formatJson(text, pretty) {
        const token = /"[^"\\]*(?:\\[\s\S][^"\\]*)*"|[\[{][\t\r\n ]*[\]}]|[\t\r\n ]+|[\[\]{},:]/g;
        let depth = 0;
        function newline() {
            return '\n' + '  '.repeat(depth);
        }
        return text.replace(token, part => {
            if (part[0] === '"') return part;
            if (part.length > 1 && /[\[{]/.test(part[0])) return part[0] + part[part.length - 1];
            if (/^[\t\r\n ]/.test(part)) return '';
            if (!pretty) return part;
            if (part === ':') return ': ';
            if (part === ',') return ',' + newline();
            if (part === '{' || part === '[') {
                depth++;
                return part + newline();
            }
            depth--;
            return newline() + part;
        });
    }

    // Blob encodes text as UTF-8 and would replace a lone surrogate with U+FFFD.
    function escapeLoneSurrogates(json) {
        return json.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\uD800-\uDFFF]/g, value =>
            value.length === 2 ? value : '\\u' + value.charCodeAt(0).toString(16));
    }

    function unpackSave(text, lz) {
        // Base64 cannot contain '#'; the marker may also occur inside a metadata string.
        const index = text.lastIndexOf(saveMarker);
        if (index === -1) {
            if (base64Pattern.test(text.replace(/[\t\r\n ]/g, ''))) {
                throw new Error('此文件没有 SAVEDATA 封装。标准 RPG Maker MV 等纯压缩正文格式目前不受支持。');
            }
            throw new Error('无法识别此存档格式：缺少 ###SAVEDATA### 分隔符。');
        }

        const meta = trimJson(text.slice(0, index));
        validateJson(meta, '存档元数据');
        const payload = text.slice(index + saveMarker.length).replace(/[\t\r\n ]/g, '');
        if (!payload) throw new Error('存档缺少 SAVEDATA 压缩数据。');
        const base64 = base64Pattern.exec(payload);
        // LZ-String can emit three "=" characters, unlike ordinary byte Base64.
        if (!base64 || (base64[2] && payload.length % 4 !== 0)) {
            throw new Error('SAVEDATA 的 LZ-String Base64 格式无效。');
        }
        const game = lz.decompressFromBase64(base64[1]);
        // The decoder can stop at an end code and ignore trailing characters.
        if (!game || lz.compressToBase64(game).replace(/=+$/, '') !== base64[1]) {
            throw new Error('SAVEDATA 压缩数据不完整、已损坏或使用了其他压缩方式。');
        }
        validateJson(game, '游戏数据');
        return metaHeading + '\n' + formatJson(meta, true) + '\n\n' + gameHeading + '\n' +
            escapeLoneSurrogates(formatJson(trimJson(game), true));
    }

    function packSave(text, lz) {
        text = text.replace(/\r\n?/g, '\n');
        const firstLine = text.indexOf('\n');
        const gameMarker = /\n[\t ]*========== 解密后的游戏数据 ==========[\t ]*\n/;
        const marker = gameMarker.exec(text);
        if (firstLine === -1 || trimJson(text.slice(0, firstLine)) !== metaHeading ||
            !marker || marker.index < firstLine) {
            throw new Error('不支持的 TXT 格式，请使用本工具导出的元数据和游戏数据标记。');
        }

        const meta = trimJson(text.slice(firstLine + 1, marker.index));
        const game = trimJson(text.slice(marker.index + marker[0].length));
        validateJson(meta, '存档元数据');
        validateJson(game, '游戏数据');
        return formatJson(meta, false) + saveMarker + lz.compressToBase64(game);
    }

    async function readText(file) {
        if (typeof TextDecoder !== 'function') {
            throw new Error('此浏览器缺少 UTF-8 文件解码功能，请使用新版浏览器。');
        }
        let bytes;
        try {
            if (typeof file.arrayBuffer === 'function') {
                bytes = await file.arrayBuffer();
            } else {
                bytes = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reader.onabort = reject;
                    reader.readAsArrayBuffer(file);
                });
            }
        } catch (error) {
            if (error instanceof RangeError) throw error;
            throw new Error('文件读取失败，请重新选择文件后重试。');
        }

        try {
            return trimJson(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
        } catch (error) {
            if (!(error instanceof TypeError)) throw error;
            throw new Error('文件无法按 UTF-8 读取，可能使用了二进制存档格式、其他编码或含无效字节。');
        }
    }

    function download(content, filename, mimeType) {
        const a = document.createElement('a');
        const urlApi = window.URL;
        if (typeof Blob !== 'function' || !urlApi || typeof urlApi.createObjectURL !== 'function' ||
            typeof urlApi.revokeObjectURL !== 'function' || !('download' in a)) {
            throw new Error('此浏览器不支持本地文件下载，请使用新版浏览器。');
        }
        const url = urlApi.createObjectURL(new Blob([content], { type: mimeType }));
        try {
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
        } finally {
            if (a.parentNode) a.parentNode.removeChild(a);
            // Give browsers time to start reading the Blob after the click.
            setTimeout(() => urlApi.revokeObjectURL(url), 30000);
        }
    }

    const $ = id => document.getElementById(id);
    function setupConversion(prefix, convert, outputName, mimeType, successMessage) {
        const drop = $(prefix + 'DropZone');
        const input = $(prefix + 'Input');
        const info = $(prefix + 'FileInfo');
        const button = $(prefix + 'Btn');
        const message = $(prefix + 'Msg');
        let selection = null;
        let busy = false;

        function select(file) {
            selection = { file };
            info.textContent = '已选择: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
            info.classList.add('show');
            message.className = 'msg';
            button.disabled = busy;
        }

        drop.addEventListener('click', event => {
            if (event.target !== input) input.click();
        });
        drop.addEventListener('dragover', event => {
            event.preventDefault();
            drop.classList.add('drag-over');
        });
        drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
        drop.addEventListener('drop', event => {
            event.preventDefault();
            drop.classList.remove('drag-over');
            const files = event.dataTransfer && event.dataTransfer.files;
            if (files && files.length) select(files[0]);
        });
        input.addEventListener('change', () => {
            if (input.files && input.files.length) select(input.files[0]);
            input.value = '';
        });

        button.addEventListener('click', async () => {
            if (!selection || busy) return;
            const current = selection;
            busy = true;
            button.disabled = true;
            button.setAttribute('aria-busy', 'true');
            message.className = 'msg';
            try {
                const lz = window.LZString;
                if (!lz || typeof lz.compressToBase64 !== 'function' ||
                    typeof lz.decompressFromBase64 !== 'function') {
                    throw new Error('转换组件加载失败，请刷新页面后重试。');
                }
                const text = await readText(current.file);
                if (selection !== current) return;
                if (!text) throw new Error('文件为空或只包含空白。');
                const output = convert(text, lz);
                const name = outputName(current.file.name);
                download(output, name, mimeType);
                message.textContent = successMessage(name);
                message.className = 'msg success';
            } catch (error) {
                if (selection !== current) return;
                const detail = error instanceof RangeError
                    ? '文件或解压后的数据超出浏览器可处理的大小。'
                    : error.message;
                message.textContent = '错误: ' + detail;
                message.className = 'msg error';
            } finally {
                busy = false;
                button.disabled = false;
                button.removeAttribute('aria-busy');
            }
        });
    }

    setupConversion('decrypt', unpackSave,
        name => name.replace(/\.rpgsave$/i, '') + '----解密.txt',
        'text/plain;charset=utf-8', () => '解密成功！文件已下载。');
    setupConversion('encrypt', packSave,
        name => (name.replace(/(?:----解密)?\.txt$/i, '') || 'save') + '.rpgsave',
        'application/octet-stream', name => '加密成功！文件已下载: ' + name);
}());
</script>
</body>
</html>
